version: "3.8"

services:
  mongodb:
    image: mongo:6.0
    restart: always
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongoadmin
      MONGO_INITDB_ROOT_PASSWORD: examplepassword
    ports:
      - "27017:27017"

  backend:
    image: <DOCKERHUB_USERNAME>/crud-mean-backend:latest
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: always
    environment:
      PORT: 3000
      MONGO_URL: mongodb://mongoadmin:examplepassword@mongodb:27017/mean_db?authSource=admin
    depends_on:
      - mongodb
    networks:
      - appnet
    expose:
      - "3000"

  frontend:
    image: <DOCKERHUB_USERNAME>/crud-mean-frontend:latest
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: always
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - appnet

  nginx:
    image: nginx:stable-alpine
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    depends_on:
      - frontend
      - backend
    networks:
      - appnet

volumes:
  mongo_data:

networks:
  appnet:
    driver: bridge
